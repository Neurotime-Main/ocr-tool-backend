# One Docker service does everything: HTTP and OCR.
#
# Splitting recognition into its own worker is the right shape once OCR volume
# justifies it, and the code still supports it (`node dist/worker.js`, with
# RUN_OCR_IN_API=false here). It is not the default because a second service is
# a second set of environment variables to keep in step -- same database, same
# Spaces credentials, same image -- and getting any of them wrong fails
# silently: documents queue forever, or every page reports a missing file.
#
# See the "Scaling up" section of README.md before adding the worker.

services:
  - type: web
    name: markwise-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Your Neon project lives in eu-central-1, so keep the service and the Space
    # in Frankfurt too. A cross-region hop is paid on every query and on every
    # PDF pulled back for recognition.
    region: frankfurt
    # OCR keeps working through a deploy until the in-flight pages are handed
    # back to the queue.
    maxShutdownDelaySeconds: 120
    # Two CPUs is the floor worth deploying.
    #
    # Recognition is CPU bound and one page uses one core, and this service also
    # has to answer HTTP -- so one core is held back for that, and a 1-CPU plan
    # would leave exactly zero for OCR (it is clamped to one, but then every
    # request competes with it and the health check can time out). On `standard`
    # one page is recognised at a time; `pro` (4 GB / 2 CPU) gives two.
    #
    # Most pages never reach the recogniser at all -- anything with a usable
    # text layer is read directly, which for typical publication PDFs is the
    # large majority -- so this matters most for scanned, image-only documents.
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production

      # --- Neon -------------------------------------------------------------
      # DATABASE_URL: the POOLED connection string (host contains "-pooler").
      # DIRECT_URL:   the direct connection string, used by prisma migrate.
      # Both need ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Vercel -----------------------------------------------------------
      # Comma-separated origins, no trailing slash. Include the preview pattern
      # so branch deploys are not blocked by CORS, e.g.
      #   https://markwise.vercel.app,https://markwise-*.vercel.app
      - key: CLIENT_ORIGIN
        sync: false

      # --- Object storage (DigitalOcean Spaces, ams3) ------------------------
      # Required in production: Render erases this service's disk on every
      # deploy, so a locally stored PDF would not survive one.
      - key: STORAGE_DRIVER
        value: spaces
      # The Space name on its own, with no region and no URL.
      - key: DO_SPACES_BUCKET
        sync: false
      # What selects Spaces. Without it the SDK resolves an amazonaws.com host
      # and 'ams3' signs against nothing, so every call fails.
      - key: DO_SPACES_ENDPOINT
        value: https://ams3.digitaloceanspaces.com
      # Amsterdam. Used only for signing, but it must match the endpoint host.
      - key: DO_SPACES_REGION
        value: ams3
      - key: DO_SPACES_FORCE_PATH_STYLE
        value: true
      # The SDK frames PutObject as 'aws-chunked' to append a trailing
      # checksum, which Spaces rejects.
      - key: DO_SPACES_DISABLE_CHECKSUMS
        value: true
      # Spaces access key and secret, not AWS IAM credentials.
      - key: DO_SPACES_KEY
        sync: false
      - key: DO_SPACES_SECRET
        sync: false
      - key: DO_SPACES_PREFIX
        value: documents

      # --- Uploads ----------------------------------------------------------
      - key: MAX_BATCH_FILES
        value: 30
      - key: MAX_UPLOAD_MB
        value: 50

      # --- OCR --------------------------------------------------------------
      # Everything below is optional; the defaults are sized from the CPU and
      # memory the container is actually given.
      #
      # OCR_CONCURRENCY      pages recognised at once (default: cores - 1)
      # OCR_RENDER_DPI       rasterisation DPI (default 200)
      # PPOCR_DET_MAX_SIDE   detector input size; 1600 reads dense body copy,
      #                      1280 is ~a third faster and loses the smallest text
      # RUN_OCR_IN_API       set to false only once a worker service exists
