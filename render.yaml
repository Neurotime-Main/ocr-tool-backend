# One Docker service does everything: HTTP and OCR, and it has to.
#
# Uploads, the page queue and recognised pages live in the API process's own
# memory, so recognition cannot be split into a second service: that service
# would hold an empty workspace and never find a page to read. `dist/worker.js`
# refuses to start for the same reason. Scale recognition with this service's
# CPU and OCR_CONCURRENCY instead.
#
# The other consequence: a redeploy empties the workspace. Anything uploaded but
# not yet published has to be uploaded again, so deploy between batches.

services:
  - type: web
    name: markwise-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Your Neon project lives in eu-central-1, so keep the service and the Space
    # in Frankfurt too. A cross-region hop is paid on every query and on every
    # PDF pulled back for recognition.
    region: frankfurt
    # OCR keeps working through a deploy until the in-flight pages are handed
    # back to the queue.
    maxShutdownDelaySeconds: 120
    # Two CPUs is the floor worth deploying for production batches.
    #
    # Recognition is CPU bound and one page uses one core. Render `standard` is
    # only 1 CPU / 2 GB and therefore reads one page at a time. `pro` is the
    # legacy name for the 2 CPU / 4 GB (`2c-4g`) plan and reads two at once.
    #
    # Most pages never reach the recogniser at all -- anything with a usable
    # text layer is read directly, which for typical publication PDFs is the
    # large majority -- so this matters most for scanned, image-only documents.
    plan: pro
    envVars:
      - key: NODE_ENV
        value: production

      # --- Vercel -----------------------------------------------------------
      # Comma-separated origins, no trailing slash. Include the preview pattern
      # so branch deploys are not blocked by CORS, e.g.
      #   https://markwise.vercel.app,https://markwise-*.vercel.app
      - key: CLIENT_ORIGIN
        sync: false

      # --- Object storage (DigitalOcean Spaces, ams3) ------------------------
      # Required in production: Render erases this service's disk on every
      # deploy, so a locally stored PDF would not survive one.
      - key: STORAGE_DRIVER
        value: spaces
      # The Space name on its own, with no region and no URL.
      - key: DO_SPACES_BUCKET
        sync: false
      # What selects Spaces. Without it the SDK resolves an amazonaws.com host
      # and 'ams3' signs against nothing, so every call fails.
      - key: DO_SPACES_ENDPOINT
        value: https://ams3.digitaloceanspaces.com
      # Amsterdam. Used only for signing, but it must match the endpoint host.
      - key: DO_SPACES_REGION
        value: ams3
      - key: DO_SPACES_FORCE_PATH_STYLE
        value: true
      # The SDK frames PutObject as 'aws-chunked' to append a trailing
      # checksum, which Spaces rejects.
      - key: DO_SPACES_DISABLE_CHECKSUMS
        value: true
      # Spaces access key and secret, not AWS IAM credentials.
      - key: DO_SPACES_KEY
        sync: false
      - key: DO_SPACES_SECRET
        sync: false
      - key: DO_SPACES_PREFIX
        value: documents

      # --- Uploads ----------------------------------------------------------
      - key: MAX_BATCH_FILES
        value: 30
      - key: MAX_UPLOAD_MB
        value: 50

      # --- OCR --------------------------------------------------------------
      # Everything below is optional; the defaults are sized from the CPU and
      # memory the container is actually given.
      #
      # OCR_CONCURRENCY      pages recognised at once (default: CPU quota)
      # OCR_RENDER_DPI       rasterisation DPI (default 200)
      # PPOCR_DET_MAX_SIDE   detector input size; 1600 reads dense body copy,
      #                      1280 is ~a third faster and loses the smallest text
      # OCR_MAX_RETAINED_DOCUMENTS  how many documents stay in memory before
      #                      the oldest finished ones are dropped (default 200)
      - key: OCR_QUEUE_NAMESPACE
        value: production
