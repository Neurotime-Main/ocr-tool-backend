services:
  - type: web
    name: markwise-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Your Neon project lives in eu-central-1, so keep the API and the S3
    # bucket in Frankfurt too. A cross-region hop is paid on every query and
    # on every page image pulled back for OCR.
    region: frankfurt
    # OCR keeps working through a deploy until the queue drains.
    maxShutdownDelaySeconds: 120
    # OCR is CPU and memory hungry: each page runs a native Tesseract process
    # holding the raster and its language model. Starter (512 MB) runs one page
    # at a time and is tight; Standard (2 GB / 1 CPU) is the realistic floor for
    # batches. CPU is what decides per-page latency, so more cores is the upgrade
    # that makes a large document finish sooner.
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production

      # --- Neon -------------------------------------------------------------
      # DATABASE_URL: the POOLED connection string (host contains "-pooler").
      # DIRECT_URL:   the direct connection string, used by prisma migrate.
      # Both need ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Vercel -----------------------------------------------------------
      # Comma-separated origins, no trailing slash. Include the preview pattern
      # so branch deploys are not blocked by CORS, e.g.
      #   https://markwise.vercel.app,https://markwise-*.vercel.app
      - key: CLIENT_ORIGIN
        sync: false

      # --- Object storage (DigitalOcean Spaces, ams3) ------------------------
      # Render's disk is ephemeral, so uploaded PDFs must live in object
      # storage. The AWS SDK is the client because Spaces speaks the S3
      # protocol, but nothing here is AWS and no AWS account is involved.
      - key: STORAGE_DRIVER
        value: spaces
      # The Space name on its own, with no region and no URL.
      - key: DO_SPACES_BUCKET
        sync: false
      # What selects Spaces. Without it the SDK resolves an amazonaws.com host
      # and 'ams3' signs against nothing, so every call fails.
      - key: DO_SPACES_ENDPOINT
        value: https://ams3.digitaloceanspaces.com
      # Amsterdam. Used only for signing, but it must match the endpoint host.
      - key: DO_SPACES_REGION
        value: ams3
      - key: DO_SPACES_FORCE_PATH_STYLE
        value: true
      # The SDK frames PutObject as 'aws-chunked' to append a trailing
      # checksum, which Spaces rejects. Both flags default to the Spaces-safe
      # setting in config.ts; they are spelled out here so the behaviour is
      # visible on the service rather than implied.
      - key: DO_SPACES_DISABLE_CHECKSUMS
        value: true
      # Spaces access key and secret, not AWS IAM credentials.
      - key: DO_SPACES_KEY
        sync: false
      - key: DO_SPACES_SECRET
        sync: false
      - key: DO_SPACES_PREFIX
        value: documents

      # --- Uploads ----------------------------------------------------------
      - key: MAX_BATCH_FILES
        value: 30
      - key: MAX_UPLOAD_MB
        value: 50
      - key: UPLOAD_STORAGE_CONCURRENCY
        value: 4

      # --- OCR throughput ---------------------------------------------------
      # Leave OCR_CONCURRENCY unset: the service sizes the recognition pool
      # from the instance's CPU count and free memory. Set it only to pin the
      # pool on a small plan, or to raise it after moving to a larger one.
      # - key: OCR_CONCURRENCY
      #   value: 2
      - key: OCR_RENDER_DPI
        value: 260
      - key: OCR_MAX_PAGE_PIXELS
        value: 12000000
